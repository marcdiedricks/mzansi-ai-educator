<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Warm African Sunrise Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Neural Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Accent Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.25" />

  <!-- Stylized African Sunrise (Geometric) -->
  <circle cx="256" cy="270" r="110" fill="url(#sunGrad)" />
  <path d="M 146 270 A 110 110 0 0 0 366 270 Z" fill="#0f172a" fill-opacity="0.3" />

  <!-- Circuit & Neural Network Connections -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <!-- Connecting Lines -->
    <line x1="256" y1="130" x2="256" y2="200" />
    <line x1="256" y1="200" x2="190" y2="260" />
    <line x1="256" y1="200" x2="322" y2="260" />
    <line x1="190" y1="260" x2="210" y2="340" />
    <line x1="322" y1="260" x2="302" y2="340" />
    <line x1="210" y1="340" x2="256" y2="375" />
    <line x1="302" y1="340" x2="256" y2="375" />
  </g>

  <!-- AI Neural Nodes -->
  <circle cx="256" cy="130" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  <circle cx="256" cy="200" r="18" fill="url(#glowGrad)" stroke="#ffffff" stroke-width="4" />
  <circle cx="190" cy="260" r="15" fill="#fde047" stroke="#ffffff" stroke-width="4" />
  <circle cx="322" cy="260" r="15" fill="#fde047" stroke="#ffffff" stroke-width="4" />
  <circle cx="210" cy="340" r="13" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  <circle cx="302" cy="340" r="13" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  <circle cx="256" cy="375" r="16" fill="#f97316" stroke="#ffffff" stroke-width="4" />

  <!-- Base Baseline Chevron (African Knowledge Arch) -->
  <path d="M 170 410 L 256 385 L 342 410" fill="none" stroke="url(#sunGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
