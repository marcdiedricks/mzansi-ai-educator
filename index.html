<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="Mzansi AI Educator - Culturally contextualized, offline-first AI literacy Progressive Web App." />

    <!-- Restore GitHub Pages deep links before React Router starts -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var route = params.get('p');
        if (!route) return;
        params.delete('p');
        var query = params.toString();
        var target = '/mzansi-ai-educator' + (route.charAt(0) === '/' ? route : '/' + route);
        if (query) target += '?' + query;
        target += window.location.hash;
        window.history.replaceState(null, '', target);
      })();
    </script>

    <!-- App Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/mzansi-ai-educator/icon.svg" />
    <link rel="apple-touch-icon" href="/mzansi-ai-educator/icon.svg" />
    <link rel="manifest" href="/mzansi-ai-educator/manifest.json" />

    <title>Mzansi AI Educator</title>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
